name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Image version (for example, v0.7.0)
        required: true

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          package_version="${RELEASE_VERSION#v}"
          echo "image_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.package_version }}
            VCS_REF=${{ github.sha }}
          tags: |
            acryldata/mcp-server-datahub:${{ steps.version.outputs.image_version }}
            acryldata/mcp-server-datahub:${{ steps.version.outputs.package_version }}
            ${{ github.event_name == 'release' && github.event.release.prerelease == false && 'acryldata/mcp-server-datahub:latest' || '' }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.image_version }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.package_version }}
            ${{ github.event_name == 'release' && github.event.release.prerelease == false && format('ghcr.io/{0}:latest', github.repository) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
