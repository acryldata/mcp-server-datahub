services:
  mcp-server-datahub:
    image: ${MCP_SERVER_IMAGE:-mcp-server-datahub:local}
    build:
      context: .
      args:
        VERSION: ${MCP_SERVER_VERSION:-0.0.0}
    restart: unless-stopped
    ports:
      - "${MCP_SERVER_PORT:-8000}:${MCP_SERVER_INTERNAL_PORT:-8000}"
    environment:
      DATAHUB_GMS_URL: ${DATAHUB_GMS_URL:?DATAHUB_GMS_URL is required}
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: ${MCP_SERVER_INTERNAL_PORT:-8000}
      TOOLS_IS_MUTATION_ENABLED: ${TOOLS_IS_MUTATION_ENABLED:-false}
      TOOLS_IS_USER_ENABLED: ${TOOLS_IS_USER_ENABLED:-false}
